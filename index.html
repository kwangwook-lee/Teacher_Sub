`;
        // ============================================================================

        const DAY_KOR = { mon: '월', tue: '화', wed: '수', thu: '목', fri: '금', sat: '토', sun: '일' };
        const DAYS_EN = ['mon', 'tue', 'wed', 'thu', 'fri'];
        const DAYS_KOR_LIST = ['월', '화', '수', '목', '금'];
        const EXCLUDED_TEACHERS = ['이정연', '주원석'];

        const getTodayString = () => {
            const today = new Date();
            const offset = today.getTimezoneOffset() * 60000;
            return (new Date(today - offset)).toISOString().split('T')[0];
        };

        // 컴포넌트 외부로 이동 (매 렌더마다 재생성 방지)
        const parseCSVLine = (text) => {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (c === '"') {
                    inQuotes = !inQuotes;
                } else if (c === ',' && !inQuotes) {
                    result.push(current);
                    current = '';
                } else {
                    current += c;
                }
            }
            result.push(current);
            return result.map(s => s.trim());
        };

        const makeEmptySchedule = () => ({
            mon: ['','','','','','',''],
            tue: ['','','','','','',''],
            wed: ['','','','','','',''],
            thu: ['','','','','','',''],
            fri: ['','','','','','',''],
        });

        const App = () => {
            const [activeTab, setActiveTab] = useState('register');
            const [teachersMaster, setTeachersMaster] = useState([]);
            const [selectedSemester, setSelectedSemester] = useState('2026-1');
            const [subHistory, setSubHistory] = useState(() => {
                try {
                    const saved = localStorage.getItem('smartSubHistory');
                    return saved ? JSON.parse(saved) : [];
                } catch { return []; }
            });
            const [modalTeacher, setModalTeacher] = useState(null);
            const [toastMsg, setToastMsg] = useState(null);
            const [selectedAbsent, setSelectedAbsent] = useState('');
            const [selectedDate, setSelectedDate] = useState(getTodayString());
            const [selectedPeriod, setSelectedPeriod] = useState(0);
            const [manualSelectedTeacher, setManualSelectedTeacher] = useState('');
            const [statsView, setStatsView] = useState('name');

            // 날짜 → 요일 자동 추출
            const selectedDay = useMemo(() => {
                if (!selectedDate) return '';
                const idx = new Date(selectedDate).getDay();
                return ['sun','mon','tue','wed','thu','fri','sat'][idx];
            }, [selectedDate]);

            useEffect(() => {
                setManualSelectedTeacher('');
            }, [selectedAbsent, selectedDate, selectedPeriod]);

            // 결강 교사의 해당 요일 수업 교시 목록
            const availablePeriods = useMemo(() => {
                if (!selectedAbsent || teachersMaster.length === 0 || !selectedDay) return [0,1,2,3,4,5,6];
                const teacher = teachersMaster.find(t => t.name === selectedAbsent);
                if (!teacher || !teacher.schedule[selectedDay]) return [];
                const periods = [];
                for (let i = 0; i < 7; i++) {
                    const cell = teacher.schedule[selectedDay][i];
                    if (cell && cell.trim() !== '' && cell.trim() !== '-') periods.push(i);
                }
                return periods;
            }, [selectedAbsent, selectedDay, teachersMaster]);

            useEffect(() => {
                if (!selectedAbsent) return;
                if (availablePeriods.length > 0) {
                    setSelectedPeriod(prev => availablePeriods.includes(prev) ? prev : availablePeriods[0]);
                } else {
                    setSelectedPeriod(-1);
                }
            }, [availablePeriods, selectedAbsent]);

            const showToast = useCallback((msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(null), 3000);
            }, []);

            useEffect(() => {
                try { localStorage.setItem('smartSubHistory', JSON.stringify(subHistory)); }
                catch { /* localStorage 사용 불가 환경 무시 */ }
            }, [subHistory]);

            // CSV 파싱 및 교사 데이터 초기화
            useEffect(() => {
                try {
                    const teachersObj = {};
                    const deptMap = new Map();

                    RAW_DEPT_CSV.replace(/^﻿/, '').split(/\r?\n/).forEach(line => {
                        if (!line.trim()) return;
                        const parts = parseCSVLine(line);
                        if (parts.length >= 2 && parts[0] && parts[1]) {
                            deptMap.set(parts[1], parts[0]);
                            teachersObj[parts[1]] = {
                                id: parts[1],
                                name: parts[1],
                                dept: parts[0],
                                schedule: makeEmptySchedule(),
                            };
                        }
                    });

                    const rows = RAW_TIME_CSV.replace(/^﻿/, '').replace(/"/g, '').split(/\r?\n/).map(r => parseCSVLine(r));

                    let startRow = 3;
                    for (let i = 0; i < rows.length; i++) {
                        if (rows[i] && rows[i][0] === '1' && rows[i][1]) { startRow = i; break; }
                    }

                    for (let i = startRow; i < rows.length - 1; i += 2) {
                        const subjectRow = rows[i];
                        const classRow = rows[i + 1];
                        if (!subjectRow || subjectRow.length < 2) continue;

                        const rawName = (subjectRow[1] || '').trim();
                        if (!rawName || rawName === '성명') continue;

                        const nameMatch = rawName.match(/^[가-힣]+/);
                        const tName = nameMatch ? nameMatch[0] : rawName.split(/[\s(-]/)[0];
                        if (!tName || tName.length < 2) continue;

                        if (!teachersObj[tName]) {
                            teachersObj[tName] = {
                                id: tName,
                                name: tName,
                                dept: deptMap.get(tName) || '미분류',
                                schedule: makeEmptySchedule(),
                            };
                        }

                        let colIdx = 2;
                        for (let d = 0; d < 5; d++) {
                            const dayKey = DAYS_EN[d];
                            for (let p = 0; p < 7; p++) {
                                const subject = (subjectRow[colIdx] || '').trim();
                                const cls = classRow && classRow[colIdx] ? classRow[colIdx].trim() : '';
                                if (subject && subject !== '-') {
                                    teachersObj[tName].schedule[dayKey][p] = cls ? `${cls} ${subject}` : subject;
                                }
                                colIdx++;
                            }
                        }
                    }
                    setTeachersMaster(Object.values(teachersObj));
                } catch (err) {
                    console.error('CSV 파싱 오류:', err);
                    showToast('데이터 파싱 중 오류가 발생했습니다.');
                }
            }, [showToast]);

            // 학기별 보강 횟수 집계
            const teacherCounts = useMemo(() => {
                const counts = {};
                subHistory.filter(h => h.semester === selectedSemester).forEach(h => {
                    counts[h.subName] = (counts[h.subName] || 0) + 1;
                });
                return counts;
            }, [subHistory, selectedSemester]);

            // 당일 수업 시수 (자체 수업 + 배정된 보강)
            const getDayClassCount = useCallback((teacher) => {
                let count = 0;
                const s = teacher.schedule[selectedDay];
                if (s) {
                    for (let i = 0; i < 7; i++) {
                        if (s[i] && s[i].trim() !== '' && s[i].trim() !== '-') count++;
                    }
                }
                subHistory.forEach(h => {
                    if (h.semester === selectedSemester && h.date === selectedDate && h.subName === teacher.name) count++;
                });
                return count;
            }, [selectedDay, selectedDate, subHistory, selectedSemester]);

            // 3연강 여부 확인
            const isConsecutive = useCallback((teacher, day, pIdx) => {
                if (pIdx === -1) return false;
                const s = teacher.schedule[day];
                if (!s) return false;
                const eff = [...s];
                subHistory.forEach(h => {
                    if (h.semester === selectedSemester && h.date === selectedDate && h.subName === teacher.name) {
                        eff[h.period - 1] = '보강';
                    }
                });
                eff[pIdx] = '보강';
                const hasClass = c => c && c !== '' && c !== '-';
                for (let i = 0; i <= 4; i++) {
                    if (hasClass(eff[i]) && hasClass(eff[i+1]) && hasClass(eff[i+2])) return true;
                }
                return false;
            }, [subHistory, selectedSemester, selectedDate]);

            // 해당 날짜·교시에 이미 보강 배정된 교사 목록
            const busySubTeachers = useMemo(() => new Set(
                subHistory
                    .filter(h => h.semester === selectedSemester && h.date === selectedDate && h.period === selectedPeriod + 1)
                    .map(h => h.subName)
            ), [subHistory, selectedSemester, selectedDate, selectedPeriod]);

            // AI 추천 TOP 5
            const topCandidates = useMemo(() => {
                if (!selectedAbsent || teachersMaster.length === 0 || selectedPeriod === -1 || !selectedDay) return [];
                const absentTeacher = teachersMaster.find(t => t.name === selectedAbsent);
                if (!absentTeacher) return [];

                const allCounts = teachersMaster.map(t => teacherCounts[t.name] || 0);
                const minCount = allCounts.length > 0 ? Math.min(...allCounts) : 0;

                const semHistory = subHistory.filter(h => h.semester === selectedSemester);
                const lastDeptSub = semHistory.find(h => h.subDept === absentTeacher.dept);
                const lastAssigned = lastDeptSub ? lastDeptSub.subName : (semHistory[0]?.subName || '');

                const nameCompare = (a, b) => {
                    if (!lastAssigned) return a.localeCompare(b);
                    const aWrap = a <= lastAssigned;
                    const bWrap = b <= lastAssigned;
                    if (aWrap !== bWrap) return aWrap ? 1 : -1;
                    return a.localeCompare(b);
                };

                const sortFn = (a, b) => {
                    const diff = getDayClassCount(a) - getDayClassCount(b);
                    return diff !== 0 ? diff : nameCompare(a.name, b.name);
                };

                const free = teachersMaster.filter(t => {
                    if (t.name === selectedAbsent || EXCLUDED_TEACHERS.includes(t.name) || busySubTeachers.has(t.name)) return false;
                    if (!t.schedule[selectedDay]) return false;
                    const cell = t.schedule[selectedDay][selectedPeriod];
                    return (cell === '' || cell === '-') && !isConsecutive(t, selectedDay, selectedPeriod);
                });

                const sameDept  = free.filter(t => t.dept === absentTeacher.dept);
                const otherDept = free.filter(t => t.dept !== absentTeacher.dept);

                const groupA = sameDept.filter(t => (teacherCounts[t.name] || 0) < minCount + 2).sort(sortFn);
                const groupB = sameDept.filter(t => (teacherCounts[t.name] || 0) >= minCount + 2).sort(sortFn);
                const groupC = otherDept.filter(t => (teacherCounts[t.name] || 0) < minCount + 2).sort(sortFn);
                const groupD = otherDept.filter(t => (teacherCounts[t.name] || 0) >= minCount + 2)
                    .sort((a, b) => ((teacherCounts[a.name] || 0) - (teacherCounts[b.name] || 0)) || sortFn(a, b));

                return [...groupA, ...groupB, ...groupC, ...groupD].slice(0, 5);
            }, [selectedAbsent, selectedDay, selectedDate, selectedPeriod, teachersMaster, teacherCounts, subHistory, selectedSemester, busySubTeachers, getDayClassCount, isConsecutive]);

            // 수동 배정용 빈 시간 교사 전체
            const manualCandidates = useMemo(() => {
                if (!selectedAbsent || teachersMaster.length === 0 || selectedPeriod === -1 || !selectedDay) return [];
                return teachersMaster.filter(t => {
                    if (t.name === selectedAbsent || busySubTeachers.has(t.name)) return false;
                    if (!t.schedule[selectedDay]) return false;
                    const cell = t.schedule[selectedDay][selectedPeriod];
                    return cell === '' || cell === '-';
                }).sort((a, b) => a.name.localeCompare(b.name));
            }, [selectedAbsent, selectedDay, selectedPeriod, teachersMaster, busySubTeachers]);

            // 이미 배정된 기록 확인
            const existingSub = useMemo(() => {
                if (!selectedAbsent || selectedPeriod === -1 || !selectedDate) return null;
                return subHistory.find(h =>
                    h.semester === selectedSemester &&
                    h.absentName === selectedAbsent &&
                    h.date === selectedDate &&
                    h.period === selectedPeriod + 1
                );
            }, [subHistory, selectedSemester, selectedAbsent, selectedDate, selectedPeriod]);

            const handleSubConfirm = (teacher) => {
                const absent = teachersMaster.find(t => t.name === selectedAbsent);
                const record = {
                    id: Date.now().toString(),
                    semester: selectedSemester,
                    date: selectedDate,
                    day: selectedDay,
                    period: selectedPeriod + 1,
                    absentName: selectedAbsent,
                    absentDept: absent.dept,
                    subName: teacher.name,
                    subDept: teacher.dept,
                    classInfo: absent.schedule[selectedDay]?.[selectedPeriod] || '기타 배정',
                    timestamp: Date.now(),
                };
                setSubHistory(prev => [record, ...prev]);
                setModalTeacher(null);
                setManualSelectedTeacher('');
                showToast(`${teacher.name} 선생님으로 보강이 확정되었습니다.`);
            };

            const handleDeleteRecord = (id) => {
                if (window.confirm('이 보강 기록을 삭제하시겠습니까?')) {
                    setSubHistory(prev => prev.filter(r => r.id !== id));
                    showToast('기록이 삭제되었습니다.');
                }
            };

            const exportToCSV = () => {
                const data = subHistory.filter(h => h.semester === selectedSemester);
                if (data.length === 0) { showToast('내보낼 데이터가 없습니다.'); return; }

                let csv = '--- 상세 보강 내역 ---\n날짜,요일,교시,결강교사,결강과목,보강담당교사,누적횟수,학기\n';
                csv += data.map(h =>
                    `"${h.date}","${DAY_KOR[h.day] || h.day}요일","${h.period}교시","${h.absentName}","${h.classInfo}","${h.subName}","${teacherCounts[h.subName] || 0}회","${h.semester}"`
                ).join('\n');
                csv += '\n\n\n--- 교사별 누적 보강 횟수 ---\n부서,교사,횟수\n';
                csv += [...teachersMaster].sort((a,b) => a.name.localeCompare(b.name))
                    .map(t => `"${t.dept}","${t.name}","${teacherCounts[t.name] || 0}회"`).join('\n');

                const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = `보강누적기록부_${selectedSemester}.csv`; a.click();
                URL.revokeObjectURL(url);
            };

            const absentTeacherObj = teachersMaster.find(t => t.name === selectedAbsent);

            return (
                <div className="min-h-screen bg-slate-50 text-slate-800 pb-20 md:pb-0">
                    {/* 모바일 헤더 */}
                    <header className="bg-white border-b border-slate-200 px-6 py-3 sticky top-0 z-30 flex items-center justify-between md:hidden shadow-sm">
                        <h1 className="font-black text-lg text-blue-600 flex items-center gap-2">
                            {Database && <Database size={18} />} SmartSub
                        </h1>
                        <span className="text-[10px] bg-slate-100 text-slate-500 px-2 py-1 rounded font-bold">{selectedSemester}</span>
                    </header>

                    <div className="flex flex-col md:flex-row min-h-screen">
                        {/* 사이드바 */}
                        <aside className="w-64 bg-slate-900 text-white p-6 hidden md:flex flex-col sticky top-0 h-screen shadow-xl z-20">
                            <h2 className="text-xl font-black mb-8 flex items-center gap-3">
                                <div className="bg-blue-600 p-2 rounded-xl">{Database && <Database size={20}/>}</div>
                                SmartSub
                            </h2>
                            <nav className="space-y-2 flex-1">
                                {[
                                    { id: 'register', label: '보강 배정', icon: UserCheck },
                                    { id: 'history',  label: '누적 기록부', icon: History },
                                    { id: 'stats',    label: '교사별 통계', icon: BarChart3 },
                                ].map(({ id, label, icon: Icon }) => (
                                    <button key={id} onClick={() => setActiveTab(id)}
                                        className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition-all ${activeTab === id ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}>
                                        {Icon && <Icon size={18}/>} {label}
                                    </button>
                                ))}
                            </nav>
                            <div className="pt-4 border-t border-slate-800 mt-auto">
                                <p className="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-2">자동 배정 기준</p>
                                <ul className="text-[11px] text-slate-400 space-y-1.5">
                                    <li className="flex gap-2"><span className="text-blue-400">1</span><div><b className="text-slate-200">3연강 절대 불가</b></div></li>
                                    <li className="flex gap-2"><span className="text-blue-400">2</span><div><b className="text-slate-200">동교과 우선</b></div></li>
                                    <li className="flex gap-2"><span className="text-blue-400">3</span><div><b className="text-slate-200">타교과 확대</b> (동교과 불가 시)</div></li>
                                    <li className="flex gap-2"><span className="text-blue-400">4</span><div><b className="text-slate-200">당일 시수 고려</b></div></li>
                                    <li className="flex gap-2"><span className="text-blue-400">5</span><div><b className="text-slate-200">가나다순 로테이션</b></div></li>
                                    <li className="flex gap-2"><span className="text-blue-400">6</span><div><b className="text-slate-200">형평성 조율</b> (2회 이상 차이)</div></li>
                                </ul>
                            </div>
                            <div className="pt-4 border-t border-slate-800 mt-4">
                                <div className="flex items-center gap-2 text-[11px] font-bold text-green-400">
                                    <span className="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>
                                    Local Storage Active
                                </div>
                            </div>
                        </aside>

                        <main className="flex-1 w-full max-w-5xl mx-auto p-4 md:px-8 md:py-6">

                            {/* ── 보강 배정 탭 ── */}
                            {activeTab === 'register' && (
                                <div className="space-y-4 fade-in">
                                    <div className="hidden md:block">
                                        <h2 className="text-2xl font-black text-slate-800">지능형 보강 배정</h2>
                                        <p className="text-slate-500 mt-1 text-sm">연강 방지 및 누적 횟수를 고려하여 최적의 교사를 추천합니다.</p>
                                    </div>

                                    {/* 입력 폼 */}
                                    <div className="bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-slate-200 grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <div>
                                            <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">결강 교사</label>
                                            <select className="w-full p-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 font-bold"
                                                value={selectedAbsent} onChange={e => setSelectedAbsent(e.target.value)}>
                                                <option value="">교사 선택</option>
                                                {[...teachersMaster].sort((a,b) => a.name.localeCompare(b.name))
                                                    .map(t => <option key={t.id} value={t.name}>[{t.dept}] {t.name}</option>)}
                                            </select>
                                        </div>
                                        <div className="grid grid-cols-2 gap-3 md:col-span-2">
                                            <div>
                                                <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">결강 일자</label>
                                                <input type="date"
                                                    className="w-full p-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl outline-none font-bold text-slate-700"
                                                    value={selectedDate}
                                                    onChange={e => setSelectedDate(e.target.value)} />
                                            </div>
                                            <div>
                                                <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">
                                                    교시 <span className="text-blue-500 font-black">({DAY_KOR[selectedDay] || '-'}요일)</span>
                                                </label>
                                                <select className="w-full p-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl outline-none font-bold"
                                                    value={selectedPeriod}
                                                    onChange={e => setSelectedPeriod(parseInt(e.target.value))}
                                                    disabled={selectedAbsent !== '' && availablePeriods.length === 0}>
                                                    {selectedAbsent === '' ? (
                                                        [0,1,2,3,4,5,6].map(i => <option key={i} value={i}>{i+1}교시</option>)
                                                    ) : availablePeriods.length === 0 ? (
                                                        <option value="-1">해당 요일 수업 없음</option>
                                                    ) : (
                                                        availablePeriods.map(i => {
                                                            const cls = absentTeacherObj?.schedule[selectedDay]?.[i] || '';
                                                            const done = subHistory.some(h =>
                                                                h.semester === selectedSemester && h.absentName === selectedAbsent &&
                                                                h.date === selectedDate && h.period === i + 1);
                                                            return <option key={i} value={i}>{i+1}교시 ({cls}){done ? ' - [배정완료]' : ''}</option>;
                                                        })
                                                    )}
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                    {/* 추천 후보 */}
                                    <div className="space-y-2.5">
                                        <h3 className="text-base font-black text-slate-800 flex items-center gap-2 px-1">
                                            {Award && <Award size={18} className="text-blue-600"/>} 공정 추천 후보 TOP 5
                                        </h3>

                                        {teachersMaster.length === 0 ? (
                                            <div className="bg-white p-10 rounded-2xl border-2 border-dashed border-slate-200 text-center text-slate-400">
                                                {AlertCircle && <AlertCircle className="mx-auto mb-3 opacity-20" size={40}/>}
                                                <p className="font-bold text-sm">시간표 데이터를 불러오는 중입니다...</p>
                                            </div>
                                        ) : !selectedAbsent ? (
                                            <div className="bg-white p-10 rounded-2xl border-2 border-dashed border-slate-200 text-center text-slate-400">
                                                {Search && <Search className="mx-auto mb-3 opacity-20" size={40}/>}
                                                <p className="font-bold text-sm">결강 교사를 선택하면 AI가 최적의 후보를 분석합니다.</p>
                                            </div>
                                        ) : selectedPeriod === -1 ? (
                                            <div className="bg-slate-50 p-10 rounded-2xl border border-slate-200 text-center">
                                                {Layout && <Layout size={36} className="mx-auto mb-3 text-slate-300"/>}
                                                <p className="text-slate-600 font-black">선택하신 날짜({DAY_KOR[selectedDay] || '-'}요일)에는 수업이 없습니다.</p>
                                                <p className="text-xs text-slate-400 mt-1">다른 날짜를 선택해주세요.</p>
                                            </div>
                                        ) : existingSub ? (
                                            <div className="bg-green-50 p-10 rounded-2xl border border-green-200 text-center">
                                                {CheckCircle2 && <CheckCircle2 size={36} className="mx-auto mb-3 text-green-500"/>}
                                                <p className="text-green-800 font-black text-lg">이미 배정이 완료된 수업입니다.</p>
                                                <p className="text-sm text-green-700 mt-1 font-bold">담당 교사: {existingSub.subName} 선생님</p>
                                                <p className="text-xs text-green-600 mt-1">[누적 기록부]에서 해당 기록을 삭제하면 재배정 가능합니다.</p>
                                            </div>
                                        ) : topCandidates.length === 0 ? (
                                            <div className="bg-orange-50 p-10 rounded-2xl border border-orange-100 text-center">
                                                {AlertCircle && <AlertCircle size={36} className="mx-auto mb-2 text-orange-400"/>}
                                                <p className="text-orange-700 font-black">추천 가능한 교사가 없습니다.</p>
                                                <p className="text-xs text-orange-500 mt-1">모든 교사가 수업 중이거나 3연강 제한에 해당됩니다.</p>
                                            </div>
                                        ) : topCandidates.map((t, idx) => (
                                            <button key={t.id} onClick={() => setModalTeacher(t)}
                                                className="w-full bg-white p-3 md:p-4 rounded-xl border border-slate-200 flex items-center justify-between hover:border-blue-500 hover:shadow-md transition-all text-left group">
                                                <div className="flex items-center gap-4">
                                                    <div className={`w-10 h-10 rounded-lg flex items-center justify-center font-black text-lg ${idx === 0 ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-400'}`}>
                                                        {idx + 1}
                                                    </div>
                                                    <div>
                                                        <div className="flex items-center gap-2">
                                                            <span className="text-base font-bold text-slate-800">{t.name}</span>
                                                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${t.dept === absentTeacherObj?.dept ? 'bg-green-100 text-green-700' : 'bg-slate-100 text-slate-500'}`}>
                                                                {t.dept}
                                                            </span>
                                                        </div>
                                                        <div className="flex items-center gap-3 mt-1 text-[11px] font-bold text-slate-400">
                                                            <span className="flex items-center gap-1 text-slate-500">{Clock && <Clock size={12}/>} 당일 {getDayClassCount(t)}시간</span>
                                                            <span className="flex items-center gap-1">{Award && <Award size={12}/>} 누적 <span className="text-blue-500">{teacherCounts[t.name] || 0}</span>회</span>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div className="bg-slate-50 p-2.5 rounded-xl group-hover:bg-blue-50 transition-colors">
                                                    {ChevronRight && <ChevronRight size={18} className="text-slate-300 group-hover:text-blue-600"/>}
                                                </div>
                                            </button>
                                        ))}
                                    </div>

                                    {/* 수동 배정 */}
                                    {selectedAbsent && selectedPeriod !== -1 && !existingSub && teachersMaster.length > 0 && selectedDay && (
                                        <div className="mt-4 pt-5 border-t border-slate-200">
                                            <h3 className="text-[13px] font-black text-slate-600 flex items-center gap-1.5 px-1 mb-2.5">
                                                {MousePointerClick && <MousePointerClick size={16} className="text-slate-400"/>}
                                                수동 임의 배정 <span className="text-[10px] text-slate-400 font-medium ml-1">(빈 시간 교사 전체)</span>
                                            </h3>
                                            <div className="flex gap-2">
                                                <select className="flex-1 p-3 text-sm bg-white border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-slate-300 font-bold shadow-sm"
                                                    value={manualSelectedTeacher}
                                                    onChange={e => setManualSelectedTeacher(e.target.value)}>
                                                    <option value="">교사 직접 선택 (가나다순)...</option>
                                                    {manualCandidates.map(t => {
                                                        const warn = isConsecutive(t, selectedDay, selectedPeriod);
                                                        return (
                                                            <option key={t.id} value={t.name}>
                                                                {t.name} ({t.dept}) - 당일 {getDayClassCount(t)}시간{warn ? ' [⚠️3연강 주의]' : ''}
                                                            </option>
                                                        );
                                                    })}
                                                </select>
                                                <button
                                                    disabled={!manualSelectedTeacher}
                                                    onClick={() => {
                                                        const t = teachersMaster.find(x => x.name === manualSelectedTeacher);
                                                        if (t) setModalTeacher(t);
                                                    }}
                                                    className="px-5 py-3 bg-slate-800 text-white font-bold rounded-xl shadow-md hover:bg-slate-700 disabled:opacity-30 transition-all text-sm whitespace-nowrap">
                                                    선택
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* ── 누적 기록부 탭 ── */}
                            {activeTab === 'history' && (
                                <div className="space-y-5 fade-in">
                                    <header className="flex flex-col md:flex-row md:items-end justify-between gap-3">
                                        <h2 className="text-2xl font-black text-slate-800">보강 누적 기록부</h2>
                                        <div className="flex gap-2">
                                            <button onClick={exportToCSV}
                                                className="p-2.5 bg-white border border-slate-200 text-slate-600 rounded-xl font-black shadow-sm flex items-center gap-2 hover:bg-slate-50 text-sm">
                                                {Download && <Download size={16}/>} 엑셀 내보내기
                                            </button>
                                            <select className="p-2.5 bg-white border border-slate-200 rounded-xl font-black outline-none shadow-sm text-sm"
                                                value={selectedSemester} onChange={e => setSelectedSemester(e.target.value)}>
                                                <option value="2026-1">2026-1학기</option>
                                                <option value="2026-2">2026-2학기</option>
                                            </select>
                                        </div>
                                    </header>
                                    <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left whitespace-nowrap">
                                                <thead className="bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-100">
                                                    <tr>
                                                        <th className="px-5 py-4">날짜 / 교시</th>
                                                        <th className="px-5 py-4">결강 정보</th>
                                                        <th className="px-5 py-4">보강 담당</th>
                                                        <th className="px-5 py-4">학급 / 과목</th>
                                                        <th className="px-5 py-4 text-right">관리</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-50 text-sm">
                                                    {subHistory.filter(h => h.semester === selectedSemester).length === 0 ? (
                                                        <tr><td colSpan="5" className="py-16 text-center text-slate-400 font-bold">저장된 내역이 없습니다.</td></tr>
                                                    ) : subHistory.filter(h => h.semester === selectedSemester).map(h => (
                                                        <tr key={h.id} className="hover:bg-slate-50 transition-colors">
                                                            <td className="px-5 py-3.5">
                                                                <p className="font-bold text-slate-700">{h.date}</p>
                                                                <p className="text-[10px] text-slate-400 font-bold mt-0.5 bg-slate-100 inline-block px-1.5 rounded">{DAY_KOR[h.day] || h.day}요일 {h.period}교시</p>
                                                            </td>
                                                            <td className="px-5 py-3.5">
                                                                <div className="flex items-center gap-1.5">
                                                                    <div className="w-1.5 h-1.5 rounded-full bg-red-400"></div>
                                                                    <span className="font-bold text-slate-600">{h.absentName}</span>
                                                                    <span className="text-[10px] font-bold text-slate-400 bg-slate-50 px-1 rounded">({h.absentDept})</span>
                                                                </div>
                                                            </td>
                                                            <td className="px-5 py-3.5">
                                                                <span className="font-bold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-lg">{h.subName} 선생님</span>
                                                            </td>
                                                            <td className="px-5 py-3.5 font-medium text-slate-500">{h.classInfo}</td>
                                                            <td className="px-5 py-3.5 text-right">
                                                                <button onClick={() => handleDeleteRecord(h.id)}
                                                                    className="p-1.5 text-slate-300 hover:text-red-500 transition-colors">
                                                                    {Trash2 && <Trash2 size={16}/>}
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* ── 통계 탭 ── */}
                            {activeTab === 'stats' && (
                                <div className="space-y-4 fade-in">
                                    <header className="flex flex-col md:flex-row md:items-end justify-between gap-3">
                                        <div>
                                            <h2 className="text-2xl font-black text-slate-800">교사별 누적 통계</h2>
                                            <p className="text-sm text-slate-500 mt-1">선택 학기의 전체 보강 횟수 분포입니다.</p>
                                        </div>
                                        <div className="flex bg-slate-100 p-1 rounded-xl shrink-0">
                                            <button onClick={() => setStatsView('name')}
                                                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${statsView === 'name' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
                                                이름 가나다순
                                            </button>
                                            <button onClick={() => setStatsView('dept')}
                                                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${statsView === 'dept' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
                                                교과별 배열
                                            </button>
                                        </div>
                                    </header>

                                    {statsView === 'name' ? (
                                        <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-2">
                                            {[...teachersMaster].sort((a,b) => a.name.localeCompare(b.name)).map(t => {
                                                const count = teacherCounts[t.name] || 0;
                                                return (
                                                    <div key={t.id} className={`p-2.5 rounded-xl border flex flex-col justify-between transition-colors ${count > 0 ? 'bg-white border-slate-200 shadow-sm' : 'bg-slate-50 border-slate-100'}`}>
                                                        <div className="flex justify-between items-start mb-1">
                                                            <span className="text-[9px] font-black bg-slate-100 text-slate-400 px-1.5 py-0.5 rounded">{t.dept}</span>
                                                            {count > 5 && AlertCircle && <AlertCircle size={12} className="text-orange-500 animate-pulse"/>}
                                                        </div>
                                                        <div className="flex items-end justify-between mt-1">
                                                            <h4 className={`text-xs font-bold whitespace-nowrap ${count > 0 ? 'text-slate-800' : 'text-slate-500'}`}>{t.name}</h4>
                                                            <div className="flex items-baseline">
                                                                <span className={`text-lg font-black leading-none ${count > 5 ? 'text-orange-500' : count > 0 ? 'text-blue-600' : 'text-slate-300'}`}>{count}</span>
                                                                <span className="text-[9px] font-bold text-slate-400 ml-0.5">회</span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-7 gap-2.5 items-start">
                                            {(() => {
                                                const deptOrder = ['국어','수학','영어','사회','과학','예술','교양'];
                                                const grouped = {};
                                                teachersMaster.forEach(t => {
                                                    const d = t.dept || '미분류';
                                                    if (!deptOrder.includes(d)) return;
                                                    if (!grouped[d]) grouped[d] = [];
                                                    grouped[d].push(t);
                                                });
                                                return deptOrder.map(dept => {
                                                    if (!grouped[dept] || grouped[dept].length === 0) return null;
                                                    return (
                                                        <div key={dept} className="flex flex-col gap-1.5">
                                                            <div className="bg-slate-100 p-1.5 rounded-lg text-center border border-slate-200 shadow-sm">
                                                                <h4 className="text-[11px] font-black text-slate-600">{dept}과</h4>
                                                            </div>
                                                            <div className="flex flex-col gap-1">
                                                                {grouped[dept].sort((a,b) => a.name.localeCompare(b.name)).map(t => {
                                                                    const count = teacherCounts[t.name] || 0;
                                                                    return (
                                                                        <div key={t.id} className={`px-2 py-1.5 rounded-md border flex items-center justify-between ${count > 0 ? 'bg-white border-slate-200 shadow-sm' : 'bg-slate-50 border-slate-100'}`}>
                                                                            <div className="flex items-center gap-1 overflow-hidden">
                                                                                <h4 className={`text-[11px] font-bold whitespace-nowrap ${count > 0 ? 'text-slate-800' : 'text-slate-500'}`}>{t.name}</h4>
                                                                                {count > 5 && AlertCircle && <AlertCircle size={10} className="text-orange-500 animate-pulse shrink-0"/>}
                                                                            </div>
                                                                            <span className={`text-sm font-black leading-none shrink-0 ${count > 5 ? 'text-orange-500' : count > 0 ? 'text-blue-600' : 'text-slate-300'}`}>{count}</span>
                                                                        </div>
                                                                    );
                                                                })}
                                                            </div>
                                                        </div>
                                                    );
                                                });
                                            })()}
                                        </div>
                                    )}
                                </div>
                            )}
                        </main>
                    </div>

                    {/* 모바일 하단 탭바 */}
                    <footer className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-2 py-1.5 flex justify-around md:hidden z-40 shadow-lg">
                        {[
                            { id: 'register', label: '배정', icon: UserCheck },
                            { id: 'history',  label: '기록',  icon: History },
                            { id: 'stats',    label: '통계',  icon: BarChart3 },
                        ].map(({ id, label, icon: Icon }) => (
                            <button key={id} onClick={() => setActiveTab(id)}
                                className={`flex flex-col items-center gap-1 p-1.5 w-14 transition-all ${activeTab === id ? 'text-blue-600' : 'text-slate-400 hover:text-slate-600'}`}>
                                {Icon && <Icon size={20}/>}
                                <span className="text-[10px] font-bold">{label}</span>
                            </button>
                        ))}
                    </footer>

                    {/* 보강 확정 모달 */}
                    {modalTeacher && (
                        <div className="fixed inset-0 z-50 flex items-end md:items-center justify-center p-0 md:p-4">
                            <div className="absolute inset-0 bg-slate-900/40" onClick={() => setModalTeacher(null)}></div>
                            <div className="relative bg-white w-full max-w-lg rounded-t-3xl md:rounded-3xl overflow-hidden shadow-2xl slide-up max-h-[90vh] flex flex-col">
                                <div className="bg-slate-900 text-white p-6 shrink-0">
                                    <div className="flex justify-between items-start">
                                        <div>
                                            <h4 className="text-2xl font-black">{modalTeacher.name} 선생님</h4>
                                            <div className="flex items-center gap-2 mt-2">
                                                <span className="bg-white/20 px-2.5 py-1 rounded-full text-[10px] font-bold">{modalTeacher.dept}</span>
                                                <span className="bg-blue-500 px-2.5 py-1 rounded-full text-[10px] font-bold">누적 {teacherCounts[modalTeacher.name] || 0}회</span>
                                            </div>
                                        </div>
                                        <button onClick={() => setModalTeacher(null)} className="p-1.5 hover:bg-white/20 rounded-full transition-colors">
                                            {X && <X size={20}/>}
                                        </button>
                                    </div>
                                </div>
                                <div className="p-5 overflow-y-auto hide-scrollbar">
                                    <h5 className="font-black text-slate-800 mb-3 flex items-center gap-2 text-sm">
                                        {Layout && <Layout size={16} className="text-blue-600"/>} 1주일 시간표 미리보기
                                    </h5>
                                    <div className="bg-slate-50 p-1.5 rounded-xl border border-slate-100">
                                        <table className="w-full text-[10px] md:text-xs">
                                            <thead>
                                                <tr className="text-slate-400 font-bold border-b border-slate-200">
                                                    {/* 수정: d가 이미 한국어이므로 DAY_KOR 거치지 않음 */}
                                                    <th className="py-2">교시</th>
                                                    {DAYS_KOR_LIST.map(d => <th key={d}>{d}</th>)}
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {[0,1,2,3,4,5,6].map(pIdx => (
                                                    <tr key={pIdx}>
                                                        <td className="py-2 text-center text-slate-400 font-black bg-white">{pIdx+1}</td>
                                                        {DAYS_EN.map(day => {
                                                            const isTarget = day === selectedDay && pIdx === selectedPeriod;
                                                            const content = modalTeacher.schedule[day][pIdx];
                                                            return (
                                                                <td key={day} className={`p-1 text-center ${isTarget ? 'bg-blue-100' : 'bg-white'}`}>
                                                                    {isTarget ? (
                                                                        <div className="bg-blue-600 text-white py-1 px-1 rounded-md font-bold text-[9px] animate-pulse shadow-sm">배정예정</div>
                                                                    ) : content ? (
                                                                        <div className="bg-slate-100 text-slate-500 py-1 px-1 rounded-md font-medium truncate max-w-[45px] mx-auto text-[9px]">{content}</div>
                                                                    ) : (
                                                                        <span className="text-slate-200">-</span>
                                                                    )}
                                                                </td>
                                                            );
                                                        })}
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                    <div className="mt-5 flex gap-2">
                                        <button onClick={() => setModalTeacher(null)}
                                            className="flex-1 py-3 bg-slate-100 text-slate-500 font-bold rounded-xl hover:bg-slate-200 transition-all text-sm">취소</button>
                                        <button onClick={() => handleSubConfirm(modalTeacher)}
                                            className="flex-[2] py-3 bg-blue-600 text-white font-bold rounded-xl shadow-md hover:bg-blue-700 transition-all text-sm">이 기록 확정하기</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 토스트 메시지 */}
                    {toastMsg && (
                        <div className="fixed bottom-20 md:bottom-8 left-1/2 -translate-x-1/2 z-50 toast-animate">
                            <div className="bg-slate-800 text-white px-5 py-3 rounded-xl shadow-2xl font-bold flex items-center gap-2 min-w-[260px] justify-center text-sm">
                                {CheckCircle2 && <CheckCircle2 className="text-green-400" size={18}/>}
                                {toastMsg}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
